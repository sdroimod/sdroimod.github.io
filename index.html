<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inventory Rampager</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>

  <div class="bg-overlay"></div>

  <header class="top-bar glass-panel">
    <div class="top-left">
      <span class="app-title">Inventory Rampager</span>
    </div>
    <div class="top-right">
      <a href="https://discord.gg/JXj89vY47b" target="_blank" class="social-link discord">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        <span>Discord</span>
      </a>
      <a href="https://www.youtube.com/@sdroimod" target="_blank" class="social-link youtube">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>YouTube</span>
      </a>
    </div>
  </header>

  <main class="app-container">
    
    <section class="equip-container glass-panel">
      
      <div class="equip-visual-wrapper">
        <div id="equip-bar" class="equip-bar">
          <img src="sprites/ui/root.png" class="root-side root-bottom" alt="">
          <img src="sprites/ui/root.png" class="root-side root-left" alt="">
          <img src="sprites/ui/root.png" class="root-side root-right" alt="">

          <div class="equip-slot slot-top" data-type="weapon">
            <span class="slot-placeholder">⚔️</span>
          </div>

          <div class="equip-slot slot-center" data-type="class">
            <img src="sprites/placeholder.png" alt="Class" class="placeholder-icon">
          </div>

          <div class="equip-slot slot-left" data-type="armor">
             <span class="slot-placeholder">🛡️</span>
          </div>

          <div class="equip-slot slot-right" data-type="artifact">
             <span class="slot-placeholder">💍</span>
          </div>
        </div>
      </div>

      <div class="char-controls">
        <button id="btn-skilltree" class="btn btn-gold btn-block">
          <span class="icon">🌳</span> Skill Tree
        </button>
      </div>

      <div class="stats-panel">
        <div class="stat-group primary">
           <div class="stat-label">Damage</div>
           <div class="stat-value text-gold" id="val-total-damage">0</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-group">
            <div class="stat-label">Armor</div>
            <div class="stat-value text-blue" id="val-total-armor">0</div>
        </div>
      </div>

      <div id="equip-info" class="equip-details-text">
        <div data-info="class" id="class-name-display">Class: Novice</div>
        <div data-info="weapon">Weapon: -</div>
        <div data-info="armor">Armor: -</div>
        <div data-info="artifact">Artifact: -</div>
      </div>
    </section>


    <section class="inventory-container glass-panel">
      <div class="inventory-header">
        <h3>Inventory</h3>
        <span class="inv-count" id="inv-count">Loading...</span>
      </div>
      <div id="inventory" class="inventory-grid">
        <div class="loading-spinner"></div>
      </div>
    </section>

  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="close-btn">&times;</button>
      <div class="modal-header">Title</div>
      <div class="modal-body"></div>
      <div class="modal-footer"></div>
    </div>
  </div>

</body>
</html>
