<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden - Access Restricted</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #1a1a24;
      --accent-color: #ff0055;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 0, 85, 0.3);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(255, 0, 85, 0.15);
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: var(--text-color);
    }

    p {
      color: var(--text-secondary);
      line-height: 1.6;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .footer-note {
      font-size: 0.85rem;
      color: #666;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>403 - Access Denied</h1>
    <p>This service is currently unavailable in your region / country due to access restrictions.</p>
    <p style="font-size: 0.9rem; color: #888;">Dịch vụ này hiện không khả dụng tại quốc gia hoặc khu vực của bạn.</p>
    <div class="footer-note">
      SDroiMod Security System &bull; Error Code: ERR_REGION_BLOCKED
    </div>
  </div>
</body>
</html>
